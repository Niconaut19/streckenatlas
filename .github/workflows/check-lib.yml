name: Bibliothek prüfen
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          curl -s https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js -o s.js
          node -e '
            const vm=require("vm"); const ctx={window:{},self:{},globalThis:{},console,setTimeout,clearTimeout,setInterval,clearInterval,fetch,URL,URLSearchParams,TextEncoder,TextDecoder,Headers,Request,Response,AbortController,WebSocket,crypto,navigator:{userAgent:"x"},location:{href:"https://x/"},localStorage:{getItem:()=>null,setItem(){},removeItem(){}}};
            ctx.window=ctx; ctx.self=ctx; ctx.globalThis=ctx; vm.createContext(ctx); vm.runInContext(require("fs").readFileSync("s.js","utf8"),ctx);
            const sb=ctx.supabase; console.log("GLOBAL", typeof sb, typeof sb?.createClient);
            const c=sb.createClient("https://vefddgcqwfyiuwejuvmn.supabase.co","sb_publishable_wH-ZHjT7iX1LRWHSvKeOmQ_wWDVTBHr");
            console.log("API", ["signInWithPassword","signUp","verifyOtp","resend","resetPasswordForEmail","updateUser","onAuthStateChange","getSession"].map(k=>k+":"+typeof c.auth[k]).join(" "));
            console.log("DB", typeof c.from("messages").insert({}).select, typeof c.from("x").upsert, typeof c.channel);
            c.from("profiles").select("*").then(r=>{console.log("QUERY", r.error?r.error.message:"ok "+r.data.length);process.exit(0)});
          '
