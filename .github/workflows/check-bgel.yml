name: Bahngelände prüfen
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q mapbox-vector-tile
          T=$(curl -s https://tiles.openfreemap.org/planet | python3 -c "import json,sys;print(json.load(sys.stdin)['tiles'][0])")
          # München Hbf, Zoomstufe 14
          python3 - "$T" <<'PY'
          import sys,math,urllib.request,mapbox_vector_tile,collections
          t=sys.argv[1]; lat,lon,z=48.1405,11.5580,14
          x=int((lon+180)/360*2**z); y=int((1-math.log(math.tan(math.radians(lat))+1/math.cos(math.radians(lat)))/math.pi)/2*2**z)
          d=mapbox_vector_tile.decode(urllib.request.urlopen(t.replace("{z}",str(z)).replace("{x}",str(x)).replace("{y}",str(y))).read())
          print("LANDUSE", dict(collections.Counter(f["properties"].get("class") for f in d.get("landuse",{}).get("features",[]))))
          PY
