name: Ortssuche prüfen
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -D h.txt -H "Origin: https://niconaut19.github.io" "https://photon.komoot.io/api/?q=Pasing&lang=de&limit=4&bbox=8.9,47.2,13.9,50.6" -o r.json
          grep -i -E "^HTTP|access-control-allow-origin" h.txt
          python3 -c "import json;j=json.load(open('r.json'));[print(f['properties'].get('name'),f['properties'].get('osm_key'),f['properties'].get('osm_value'),f['properties'].get('type'),f['properties'].get('city'),f['properties'].get('extent')) for f in j['features']]"
