name: ALKIS-Dienste prüfen
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for path in alkis/v1/tn alkis/v1/parzellarkarte alkis/v1/tatsaechliche_nutzung alkis/v1/flurstueck alkis/v1/nutzung; do
            u="https://geoservices.bayern.de/od/wms/$path?service=WMS&request=GetCapabilities&version=1.3.0"
            code=$(curl -s -o cap.xml -w "%{http_code}" "$u"); echo "== $path $code"
            if [ "$code" = "200" ]; then grep -o "<Name>[^<]*</Name>" cap.xml | head -40 | tr '\n' ' '; echo; grep -o "<Title>[^<]*</Title>" cap.xml | head -25 | tr '\n' ' '; echo; grep -c "EPSG:3857" cap.xml; fi
          done
          curl -s "https://geodaten.bayern.de/opengeodata/" | grep -o -i "geoservices.bayern.de/od/wms/[a-z0-9_/]*" | sort -u | head -40
