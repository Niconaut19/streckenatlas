    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_grenze.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add data/bayern-grenze.json && git commit -m "Umriss Bayern" && git pull --rebase origin main && git push
