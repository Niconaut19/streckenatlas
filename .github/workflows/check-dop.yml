name: Luftbild-Dienst prüfen
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for v in dop20 dop40; do
            echo "== $v"
            curl -s "https://geoservices.bayern.de/od/wms/dop/v1/$v?service=WMS&request=GetCapabilities&version=1.3.0" -o cap.xml
            grep -o "<Name>[^<]*</Name>" cap.xml | head -20
            grep -o "EPSG:3857" cap.xml | head -1
            grep -o "<Format>[^<]*</Format>" cap.xml | head -5
            grep -o "<AccessConstraints>[^<]*" cap.xml | head -2
            curl -sI "https://geoservices.bayern.de/od/wms/dop/v1/$v?service=WMS&request=GetMap&version=1.1.1&layers=by_${v}c&styles=&srs=EPSG:3857&bbox=1287000,6129000,1288000,6130000&width=256&height=256&format=image/jpeg" | grep -i -E "^HTTP|content-type|access-control"
          done
