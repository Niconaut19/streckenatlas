name: Streckendaten Bayern aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_strecken.py"
      - ".github/workflows/strecken.yml"

permissions:
  contents: write

concurrency:
  group: strecken
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Strecken aus OpenStreetMap laden
        run: python3 scripts/build_strecken.py data/strecken-bayern.geojson
      - name: Speichern, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add data/strecken-bayern.geojson
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Streckendaten Bayern aktualisiert"
            git pull --rebase origin main
            git push
          fi
