name: Live-Verbindung prüfen
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for v in 2.45.4 2.49.4 2.50.0 2.52.0 2.57.4 2.58.0; do
            printf "%s " $v; curl -s -o /dev/null -w "%{http_code}\n" https://cdn.jsdelivr.net/npm/@supabase/supabase-js@$v/dist/umd/supabase.js
          done
          cat > t.mjs <<'JS'
          const key="sb_publishable_wH-ZHjT7iX1LRWHSvKeOmQ_wWDVTBHr";
          const ws=new WebSocket(`wss://vefddgcqwfyiuwejuvmn.supabase.co/realtime/v1/websocket?apikey=${key}&vsn=1.0.0`);
          const t=setTimeout(()=>{console.log("TIMEOUT");process.exit(0)},8000);
          ws.onopen=()=>{console.log("OPEN");ws.send(JSON.stringify({topic:"realtime:test",event:"phx_join",payload:{config:{postgres_changes:[{event:"*",schema:"public",table:"markers"}]},access_token:key},ref:"1"}));};
          ws.onmessage=e=>{console.log("MSG",String(e.data).slice(0,400));};
          ws.onerror=e=>{console.log("ERROR",e.message||e.type)};
          ws.onclose=e=>{console.log("CLOSE",e.code,e.reason);clearTimeout(t);process.exit(0)};
          JS
          node t.mjs
