name: POI-Symbole prüfen
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://tiles.openfreemap.org/styles/liberty -o s.json
          python3 - <<'PY'
          import json
          s=json.load(open('s.json'))
          print("SPRITE", s.get("sprite"))
          for l in s["layers"]:
              if l.get("source-layer")=="poi":
                  print("LAYER", l["id"], json.dumps(l.get("filter"))[:300])
                  print("  ICON", json.dumps(l.get("layout",{}).get("icon-image"))[:500])
          PY
          SPR=$(python3 -c "import json;s=json.load(open('s.json'));print(s['sprite'] if isinstance(s['sprite'],str) else s['sprite'][0]['url'])")
          curl -s -D h.txt "$SPR@2x.json" -o sp.json; grep -i -E "^HTTP|access-control-allow-origin" h.txt
          python3 -c "import json;k=sorted(json.load(open('sp.json')).keys());print(len(k));print([x for x in k if any(w in x for w in ['rest','food','cafe','bak','groc','shop','fuel','toil','bar','beer','ice','super','conv','alco','cloth','pharm'])])"
